server:
  port: ${PORT:8081}

# Spring
spring:
  application:
    name: project-101.backend-java

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5533}/${DB_NAME:project101_java}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    # initialize: true
    # maxActive: 3

  sql:
    init:
      mode: always
      continue-on-error: true
      platform: postgresql

  jpa:
    hibernate:
      ddl-auto: none # update, create-drop, none
    show-sql: true
    properties:
      hibernate:
        format-sql: false
      # jakarta:
      #   persistence:
      #     schema-generation:
      #       scripts:
      #         action: create
      #         create-target: create.sql
      #         create-source: metadata

  flyway:
    enabled: true
    # default-schema: public

  jackson:
    default-property-inclusion: non-null

  mvc:
    log-resolved-exception: false

  main:
    banner-mode: off

# Swagger
springdoc:
  swagger-ui:
    path: /swagger
    operationsSorter: alpha
    tagsSorter: alpha

# Configurações customizadas
app-config:
  name: @project.name@
  description: @project.description@
  version: @project.version@

  url: ${APP_URL:http://localhost:8080}

  key: ${APP_KEY:ZGVtby1zZWNyZXQtZGV2LTEyMzQ1Ng==} # demo-secret-dev-123456 em base64

  jwt:
    secret: ${app-config.key}
    issuer: ${app-config.url}
    audience: ${app-config.url}
    expiration: ${APP_JWT_EXPIRATION:1440} # minutes

  authorization:
    endpoints-public: /auth/**, /api/status, /swagger/**, /swagger-ui.html, /swagger-ui/**, /v3/api-docs/**, /v3/api-docs.yaml, /actuator/**

  cors:
    allowedMethods: "*"
    allowedHeaders: "*"
    allowedOrigins: "*"
