spring:
  datasource:
    # driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
    username: sa
    password: sa

  flyway:
    enabled: false

  # sql:
  #   init:
  #     mode: always
  #     continue-on-error: true
  #     platform: postgresql

  jpa:
    hibernate:
      ddl-auto: create-drop # update, create-drop, none
    show-sql: true
    properties:
      hibernate:
        format-sql: false
        globally_quoted_identifiers: true
        dialect: org.hibernate.dialect.H2Dialect
        # dialect: org.hibernate.dialect.PostgreSQL9Dialect

# Configurações customizadas
app-config:
  name: ${APP_NAME:Project 101}
  description: ${APP_DESCRIPTION:App demo para explorar recursos do Spring.}
  version: ${APP_VERSION:1.0.0}
  url: ${APP_URL:http://localhost:8080}

  key:

  jwt:
    secret:
    issuer:
    audience:
    expiration:

  authorization:
    endpoints-public:

  cors:
    allowedMethods: "*"
    allowedHeaders: "*"
    allowedOrigins: "*"